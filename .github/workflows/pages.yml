name: Build and deploy site

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - blog-content-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.146.2
      NODE_VERSION: 26.0.0
      PAGEFIND_VERSION: 1.5.2

    steps:
      - name: Checkout public site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          show-progress: false

      - name: Resolve private content revision
        id: private-content
        env:
          BLOG_CONTENT_REPOSITORY: ${{ secrets.BLOG_CONTENT_REPOSITORY }}
          BLOG_READ_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${BLOG_CONTENT_REPOSITORY}" && test -n "${BLOG_READ_TOKEN}" || {
            echo "::error::Missing BLOG_CONTENT_REPOSITORY or BLOG_READ_TOKEN repository secret."
            exit 1
          }

          blog_ref="$(
            curl --fail --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${BLOG_READ_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${BLOG_CONTENT_REPOSITORY}/commits/main" |
              jq --exit-status --raw-output '.sha'
          )"
          [[ "${blog_ref}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve the private content revision."
            exit 1
          }

          # Keep the revision masked if a later Git command reports it.
          echo "::add-mask::${blog_ref}"
          echo "::add-mask::${blog_ref:0:7}"
          printf 'ref=%s\n' "${blog_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout private content without public Git metadata logs
        env:
          BLOG_CONTENT_REPOSITORY: ${{ secrets.BLOG_CONTENT_REPOSITORY }}
          BLOG_CONTENT_REF: ${{ steps.private-content.outputs.ref }}
          BLOG_READ_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}
        run: |
          set -euo pipefail
          test ! -e content || {
            echo "::error::The content checkout path already exists."
            exit 1
          }

          askpass_path="${RUNNER_TEMP}/private-content-askpass"
          checkout_error="${RUNNER_TEMP}/private-content-checkout.err"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *) printf "%s\n" "$BLOG_READ_TOKEN" ;;' \
            'esac' > "${askpass_path}"
          chmod 0700 "${askpass_path}"

          if ! GIT_ASKPASS="${askpass_path}" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= clone --quiet --branch main --single-branch \
              "https://github.com/${BLOG_CONTENT_REPOSITORY}.git" content \
              >/dev/null 2>"${checkout_error}"; then
            rm -f "${askpass_path}" "${checkout_error}"
            echo "::error::Unable to checkout private content."
            exit 1
          fi

          if ! git -C content checkout --quiet --detach "${BLOG_CONTENT_REF}" \
            >/dev/null 2>>"${checkout_error}"; then
            rm -f "${askpass_path}" "${checkout_error}"
            echo "::error::Unable to checkout the resolved private content revision."
            exit 1
          fi

          git -C content remote remove origin
          rm -f "${askpass_path}" "${checkout_error}"

      - name: Normalize content modification times from Git history
        run: |
          set -euo pipefail
          test -d content
          test ! -L content
          git -C content rev-parse --is-inside-work-tree >/dev/null

          while IFS= read -r -d '' content_file; do
            commit_epoch="$(git -C content log -1 --format=%ct -- "${content_file}")"
            test -n "${commit_epoch}"
            touch --date="@${commit_epoch}" -- "content/${content_file}"
          done < <(git -C content ls-files -z)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hugo extended
        run: |
          archive="${RUNNER_TEMP}/hugo.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          install_dir="${HOME}/.local/bin"
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" hugo
          chmod 0755 "${install_dir}/hugo"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          hugo version
          node --version
          npx --yes "pagefind@${PAGEFIND_VERSION}" --version

      - name: Verify Docs menu markup
        run: |
          if rg -n '</ul></ul>' layouts/partials/docs/inject; then
            echo "::error::Docs menu injection contains an unmatched closing tag."
            exit 1
          fi

      - name: Build static site and search index
        run: make build CONTENT_DIR=content PAGEFIND_VERSION="${PAGEFIND_VERSION}"

      - name: Verify build output
        env:
          BLOG_CONTENT_REF: ${{ steps.private-content.outputs.ref }}
        run: |
          set -euo pipefail
          test -f public/index.html
          test -d public/pagefind
          test -f public/demos/2026/rounded-timeline/index.html
          test ! -e public/static/demos/2026/rounded-timeline/index.html
          test -z "$(find public -type l -print -quit)" || {
            echo "::error::GitHub Pages artifacts cannot contain symbolic links."
            exit 1
          }

          if rg --fixed-strings --quiet -- "${BLOG_CONTENT_REF}" public; then
            echo "::error::Build output contains private Git revision metadata."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
